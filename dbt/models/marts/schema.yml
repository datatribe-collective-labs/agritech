version: 2

models:
  - name: mart_planting_features
    description: >
      The final gold-layer table. One row per city x month.
      Grain is city + month for seasonal ML features.
      Consumed by the ML model and AI recommendation engine.
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          combination_of_columns:
            - city
            - month
    columns:
      - name: city
        description: City name.
        tests:
          - not_null
      - name: month
        description: Month number 1-12.
        tests:
          - not_null
      - name: country
        description: ISO 2-letter country code.
        tests:
          - not_null
      - name: soil_ph
        description: Soil pH 0-14. Empty when no nearby WoSIS profile has a pH measurement (never guessed).
      - name: current_conditions_score
        description: 100 minus penalty points for today's frost, heat, water stress, low nitrogen and flood risk (10-100). Same in all 12 months of a city.
        tests:
          - not_null
      - name: irrigation_needed
        description: TRUE when evapotranspiration exceeds rain over the forecast window.
      - name: water_deficit_mm_per_day
        description: Water deficit in mm per day over the forecast window.
      - name: frost_zone
        description: Frost zone from average frost days per year.
      - name: companion_species_a
        description: Best companion pair for the city. Differs between cities because both species must be recorded near the city.
      - name: nitrogen_deficient
        description: TRUE when nitrogen < 1.0 g/kg.
      - name: mart_built_at
        description: Timestamp when this mart was last rebuilt by dbt.
        tests:
          - not_null

  - name: mart_ml_annual_features
    description: >
      ML Feature Table A
      Annual grain: One row per city (54 rows).
      Used for the annual recommendation model, and asnwers to which species suit
      the location year-round based on soil and long-term climate.
      Static features appear exactly once per city.
      Includes is_ml_ready flag to filter training rows.
    columns:
      - name: city
        description: City name — primary key at annual grain.
        tests:
          - not_null
          - unique
      - name: is_ml_ready
        description: TRUE when soil_ph, frost_zone and top_species_1 are all present.
        tests:
          - not_null
      - name: soil_feature_completeness
        description: Count 0-6 of populated soil features. Filter on >= 4 for training.
        tests:
          - not_null
      - name: climate_feature_completeness
        description: Count 0-5 of populated climate features. Filter on >= 3 for training.
        tests:
          - not_null

  - name: mart_ml_seasonal_features
    description: >
      ML Feature Table B. 
      Seasonal grain: one row per city x month.
      Used for the seasonal recommendation model: what to plant THIS month.
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          combination_of_columns:
            - city
            - month
    columns:
      - name: city
        description: City name.
        tests:
          - not_null
      - name: month
        description: Month number 1-12.
        tests:
          - not_null
      - name: local_season
        description: Hemisphere-adjusted season. Winter in June for Southern Hemisphere.
        tests:
          - not_null
      - name: is_ml_ready
        description: TRUE when top_species_1, avg_temp_c, avg_monthly_rain_mm and frost_zone are present.
        tests:
          - not_null
      - name: monthly_feature_completeness
        description: Count 0-5 of populated monthly climate features.
        tests:
          - not_null

  - name: mart_species_city_suitability
    description: >
      ML Feature Table C. One row per crop species and city: "does this crop suit this city?"
      Covers every city with usable soil pH and frost data, and every species in dim_plant_traits.
      The label observed_nearby says whether the crop was recorded near the city; it is a proxy
      for suitability, not a measurement of how well the crop grows.
      The fit-check columns compare what the crop needs with what the city offers, using plain
      arithmetic. A check that cannot be worked out stays empty.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - city
            - species
    columns:
      - name: city
        description: City name.
        tests:
          - not_null
      - name: species
        description: Scientific name of the crop, as in dim_plant_traits.
        tests:
          - not_null
      - name: observed_nearby
        description: 1 if the crop was recorded within the search radius of the city, otherwise 0. This is the ML label.
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: observation_count
        description: Number of recorded observations of the crop near the city. Shown for information; never used as an ML feature.
      - name: months_in_optimal_temp
        description: Months (0 to 12) whose average temperature lies inside the crop's optimal temperature range.
      - name: frost_free_months
        description: Months (0 to 12) with no frost days at the city.
      - name: months_to_mature
        description: Whole months the crop needs to reach maturity (shortest days to maturity, in 30-day months).
      - name: enough_warm_months
        description: 1 if months_in_optimal_temp is at least months_to_mature, otherwise 0.
      - name: enough_frost_free_months
        description: 1 if the crop is frost hardy, or the city has at least as many frost-free months as the crop needs to mature; otherwise 0.
      - name: ph_gap
        description: How far the soil pH is outside the crop's optimal pH range, in pH units. 0 means inside the range.
      - name: trait_fit_share
        description: Share of the checks that could be worked out (warm months, frost-free months, pH) that the crop passes, from 0 to 1.
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0 AND trait_fit_share <= 1"
              where: "trait_fit_share IS NOT NULL"
