version: 2

models:
  - name: int_location_profile
    description: >
      Present-day environmental profile per city.
      Joins stg_soil + stg_weather + stg_water on city name.
      One row per city. Adds current_conditions_score.
    columns:
      - name: city
        description: City name — primary key.
        tests:
          - not_null
          - unique
      - name: current_conditions_score
        description: 100 minus penalty points for frost, heat, water stress, low nitrogen and flood risk (range 10-100). Today's snapshot only.
        tests:
          - not_null
      - name: water_deficit_mm_per_day
        description: Water deficit in mm per day. Positive = irrigation needed.
      - name: irrigation_needed
        description: Boolean. TRUE when evapotranspiration exceeds rain.

  - name: int_climate_history
    description: >
      10-year climate summary per city from NASA POWER data.
      One row per city aggregated from ~3,650 daily rows each.
    columns:
      - name: city
        description: City name — primary key.
        tests:
          - not_null
          - unique
      - name: frost_zone
        description: Frost zone based only on average frost days per year (not heat or rainfall).
        tests:
          - not_null
          - accepted_values:
              values:
                [
                  "frost_free",
                  "light_frost",
                  "moderate_frost",
                  "heavy_frost",
                  "severe_frost",
                ]
      - name: crop_heat_class
        description: Class of yearly heat units (growing degree days) for crop compatibility.
        tests:
          - not_null
          - accepted_values:
              values: ["cool_season_only", "mixed_season", "tropical_viable"]
      - name: avg_annual_precip_mm
        description: Average total annual precipitation across 10 years.
      - name: years_of_data
        description: Number of years with >= 300 days of NASA data.

  - name: int_species_habitat
    description: >
      Ecological envelope per species from GBIF observations.
      One row per species with >= 3 confirmed observations.
    columns:
      - name: species
        description: Species name — primary key. NULL for genus-only GBIF records.
        tests:
          - not_null:
              config:
                severity: warn
          - unique
      - name: observation_count
        description: Total GBIF records for this species (minimum 3).
      - name: seasonality_class
        description: Dominant season of observation.
        tests:
          - accepted_values:
              values: ["warm_season", "cool_season", "year_round", "unknown"]
      - name: human_observation_ratio
        description: Fraction of records from direct human observation (0-1).

  - name: int_companion_matrix
    description: >
      One row per curated companion pair (antagonistic pairs included, flagged
      is_recommendable = false). Scores each pair; knows nothing about locations.
    columns:
      - name: relationship_score
        description: Relationship points (+3 / +1 / -5) times evidence multiplier (x3 / x2 / x1).
        tests:
          - not_null
      - name: benefit_category
        description: Which polyculture benefit this pair provides.
        tests:
          - not_null
          - accepted_values:
              values:
                [
                  "nutrient_sharing",
                  "pest_disruption",
                  "root_zone",
                  "ground_cover",
                  "other",
                ]

  - name: int_city_species_presence
    description: >
      Crop species observed within species_radius_km (default 500) of each city,
      by month. Counts show where a species was recorded, not how well it grows.
    columns:
      - name: city
        tests:
          - not_null
      - name: observation_count
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [city, month, species]

  - name: int_city_companions
    description: >
      Recommended companion pairs per city: both species recorded near the city
      and the pair is not antagonistic. pair_rank 1 is the best pair.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [city, species_a, species_b]
