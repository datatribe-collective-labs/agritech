# The master configuration file for the entire dbt project.

# - Project identity

name: agritech
version: "1.0.0"

# - dbt version constraint

require-dbt-version: ">=1.7.0"

# - Profile
# dbt uses the "profile" to connect to your data warehouse.
profile: agritech

# - File paths
# Tell dbt where to find each type of file.
model-paths: ["models"] # SQL transformation files
seed-paths: ["seeds"] # CSV files loaded as tables
test-paths: ["tests"] # custom singular SQL tests
macro-paths: ["macros"] # reusable SQL snippets
snapshot-paths: ["snapshots"] # slowly changing dimension snapshots

# - Where compiled SQL goes
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# - MODEL CONFIGURATIONS
# Defines how each layer materialises in Postgres.

models:
  agritech:
    # - Staging layer
    # Views are perfect here:
    #   - Staging is just renaming and light cleaning
    #   - No one queries staging directly in production

    staging:
      +materialized: view

      # Schema = which Postgres schema these models land in.
      # 'staging' == dbt creates views in a schema called
      # 'planting_intelligence_staging' (project name + schema).
      # Keeps raw, staging, and mart tables separated in the DB.
      +schema: staging

      # Tags to run only this layer: dbt run --select tag:staging
      +tags: ["staging"]

    # - Intermediate layer
    # views — intermediate models. They're only queried by downstream models,
    # never by users or the ML model directly.
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    # - Marts layer
    # Physical tables == the ML model queries these constantly.
    # Tables are pre-computed so queries are fast.
    # The mart is rebuilt completely on every dbt run.
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

    # - Warehouse layer (star schema for analysts)
    # Physical tables == analysts run ad-hoc queries directly here.
    # Separate schema keeps it separated from marts.
    warehouse:
      +materialized: table
      +schema: warehouse
      +tags: ["warehouse", "star_schema"]
