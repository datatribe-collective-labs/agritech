# pytest.ini
# ==========
# This file configures pytest — Python's standard testing framework.
# pytest reads this file automatically when you run `pytest` in the
# project root. You never need to pass these options manually.

[pytest]

# ── Where to find tests ─────────────────────────────────────
# pytest will look for test files inside the tests/ folder.
# Without this, it searches everywhere including node_modules,
# .venv, and other folders you don't want it touching.
testpaths = tests

# ── Test file naming pattern ─────────────────────────────────
# Any file matching test_*.py is treated as a test file.
# This is the pytest convention — stick to it so the whole
# team immediately knows what files contain tests.
python_files = test_*.py

# ── Test function naming pattern ──────────────────────────────
# Any function starting with test_ inside a test file is a test.
# Functions not starting with test_ are helpers, not tests.
python_functions = test_*

# ── Test class naming pattern ─────────────────────────────────
# Classes grouping tests must start with Test (capital T).
python_classes = Test*

# ── Output verbosity ─────────────────────────────────────────
# -v  = verbose: print each test name as it runs
# -s  = show print() output from tests (useful for debugging)
# --tb=short = show short tracebacks on failure (not the full wall of text)
addopts = -v -s --tb=short

# ── Markers ──────────────────────────────────────────────────
# Custom labels you can attach to tests with @pytest.mark.label
# Run only marked tests with: pytest -m unit
# Run everything except slow tests: pytest -m "not slow"
markers =
    unit: Fast tests with no external dependencies
    integration: Tests that hit a real database or API
    slow: Tests that take more than 5 seconds