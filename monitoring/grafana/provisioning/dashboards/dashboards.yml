# This file tells Grafana to load dashboard files from a folder, instead of building them by hand in the browser.

# The version of this file format (always 1).
apiVersion: 1

# The list of dashboard "providers" (places to load dashboards from).
providers:
  # A label for this provider.
  - name: planting-intelligence
    # Put these dashboards in a Grafana folder with this name.
    folder: Planting Intelligence
    # "file" means the dashboards are JSON files on disk.
    type: file
    # Check the folder for changed files every 30 seconds, so edits appear without a restart.
    updateIntervalSeconds: 30
    # Do not let people delete the provisioned dashboards from the web page.
    allowUiUpdates: false
    # Where the JSON files are on the server (install.sh copies them here).
    options:
      path: /var/lib/grafana/dashboards
