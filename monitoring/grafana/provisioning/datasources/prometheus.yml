# "Provisioning" means Grafana reads this file at start-up and sets itself up, so you never click through menus.
# This file tells Grafana where its numbers come from: the Prometheus diary on this same server.

# The version of this file format (always 1).
apiVersion: 1

# The list of data sources Grafana should know about.
datasources:
  # The name you will see in Grafana's menus.
  - name: Prometheus
    # The kind of data source.
    type: prometheus
    # A fixed id. The dashboard files refer to this id, so it must never change.
    uid: prometheus
    # "proxy" means Grafana's server asks Prometheus (not your browser), which keeps Prometheus private.
    access: proxy
    # Where Prometheus listens on this server.
    url: http://127.0.0.1:9090
    # Use this data source automatically for new charts.
    isDefault: true
    # Stop people editing it in the web page, so the file stays the single source of truth.
    editable: false
